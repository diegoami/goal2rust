[package]
name = "goal2rust-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "goal2rust T01: hot routines of goal2-archaeology's Python match port, in Rust, behind PyO3"
license = "MIT"

[lib]
name = "goal2rust_engine"
crate-type = ["cdylib", "rlib"]

[features]
# The Python bindings: maturin builds with them (pyproject.toml); plain `cargo test` runs without, so the
# accessor and routine tests link no interpreter.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "=0.30.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
